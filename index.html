<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="wwwroot/css/style.css">
    <script src="wwwroot/js/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Mario Jump</title>
</head>

<body>
    <div class="container">
        <div class="leaderboard">
            <h2>🏆 Podium</h2>
            <ol>
                <li><span class="gold">1º</span> Jogador 1 - 999</li>
                <li><span class="silver">2º</span> Jogador 2 - 800</li>
                <li><span class="bronze">3º</span> Jogador 3 - 600</li>
            </ol>
        </div>
        <div>
            <div class="game-board">
                <img src="wwwroot/img/clouds.png" class="clouds">
                <img src="wwwroot/img/mario.gif" class="mario">
                <img src="wwwroot/img/pipe.png" class="pipe">
                <div class="score">0</div>
            </div>
            <div class="ground"></div>
        </div>
    </div>
</body>

</html>
