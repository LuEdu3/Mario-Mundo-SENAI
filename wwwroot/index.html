<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Mario Jump</title>
</head>

<body>
    <div class="container">
        <div class="leaderboard">
            <h2>🏆 Pódio</h2>
            <div class="podium">
                <div class="podium-place second">
                    <div class="podium-block">2</div>
                    <div class="podium-name" id="podium-2-name"></div>
                    <div class="podium-score" id="podium-2-score"></div>
                </div>
                <div class="podium-place first">
                    <div class="podium-block">1</div>
                    <div class="podium-name" id="podium-1-name"></div>
                    <div class="podium-score" id="podium-1-score"></div>
                </div>
                <div class="podium-place third">
                    <div class="podium-block">3</div>
                    <div class="podium-name" id="podium-3-name"></div>
                    <div class="podium-score" id="podium-3-score"></div>
                </div>
            </div>
        </div>
        <div>
            <div class="game-board">
                <img src="img/clouds.png" class="clouds">
                <img src="img/mario.gif" class="mario">
                <img src="img/pipe.png" class="pipe"> <!-- Cano fixo animado por CSS -->
                <div class="score">0</div>
                <div class="game-over">GAME OVER</div>
                <div class="user-form-overlay active">
                    <form class="user-form">
                        <label for="username">Digite seu nome:</label>
                        <input type="text" id="username" name="username" maxlength="20" required autocomplete="off">
                        <button type="submit">Confirmar</button>
                    </form>
                </div>
            </div>
            <div class="ground"></div>
        </div>
    </div>
</body>

</html>
